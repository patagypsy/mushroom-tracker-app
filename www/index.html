<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mushroom Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 480px; margin: 0 auto;
      padding: 48px 24px 32px;
      background: #f0f4f0; color: #1a1a1a;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
    }
    .logo { font-size: 2.5rem; text-align: center; margin-bottom: 8px; }
    h1 { font-size: 1.5rem; color: #2d5a2d; text-align: center; margin: 0 0 6px; }
    .grower { font-size: 0.9rem; color: #888; text-align: center; margin-bottom: 48px; }
    .grower span { color: #2d7a2d; font-weight: 600; }
    .menu { display: flex; flex-direction: column; gap: 14px; }
    .menu-btn {
      display: flex; align-items: center; gap: 16px;
      background: white; border: none; border-radius: 14px;
      padding: 20px 22px; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: left; width: 100%;
      transition: transform 0.1s;
    }
    .menu-btn:active { transform: scale(0.98); }
    .menu-btn .icon { font-size: 2rem; width: 48px; text-align: center; flex-shrink: 0; }
    .menu-btn .text .title { font-size: 1.1rem; font-weight: 700; color: #1a1a1a; }
    .menu-btn .text .sub { font-size: 0.8rem; color: #888; margin-top: 2px; }
    .menu-btn.primary { background: #2d7a2d; }
    .menu-btn.primary .text .title { color: white; }
    .menu-btn.primary .text .sub { color: rgba(255,255,255,0.7); }
    .change-grower { text-align: center; margin-top: 32px; font-size: 0.8rem; color: #aaa; }
    .change-grower a { color: #2d7a2d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="logo">🍄</div>
  <h1>Mushroom Tracker</h1>
  <p class="grower">Inloggad som <span id="grower-name"></span></p>

  <div class="menu">
    <button class="menu-btn primary" onclick="location.href='new-batch.html'">
      <div class="icon">+</div>
      <div class="text">
        <div class="title">Ny batch</div>
        <div class="sub">Skapa ny odlingsbatch</div>
      </div>
    </button>

    <button class="menu-btn" id="dashboard-btn" onclick="goToDashboard()">
      <div class="icon">📊</div>
      <div class="text">
        <div class="title">Dashboard</div>
        <div class="sub">Statistik och skördar</div>
      </div>
    </button>
  </div>

  <p class="change-grower"><a onclick="changeGrowerName()" href="#">Byt namn</a></p>

  <script>
    const grower = localStorage.getItem('odlare');
    if (!grower) {
      const name = prompt('Vad heter du?');
      if (name && name.trim()) {
        localStorage.setItem('odlare', name.trim());
        location.reload();
      }
    } else {
      document.getElementById('grower-name').textContent = grower;
    }

    function goToDashboard() {
      const odlare = localStorage.getItem('odlare') || '';
      location.href = 'stats.html?odlare=' + encodeURIComponent(odlare);
    }

    function changeGrowerName() {
      const name = prompt('Nytt namn:', localStorage.getItem('odlare') || '');
      if (name && name.trim()) {
        localStorage.setItem('odlare', name.trim());
        location.reload();
      }
    }
  </script>
</body>
</html>
