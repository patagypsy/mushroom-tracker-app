<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ny batch</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 480px; margin: 0 auto; padding: 20px 16px;
      background: #f0f4f0; color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; color: #2d5a2d; }
    .grower-tag { font-size: 0.8rem; color: #888; margin-bottom: 20px; }
    .grower-tag span { color: #2d7a2d; font-weight: 600; }
    .grower-tag a { color: #2d7a2d; }
    label { display: block; margin-top: 16px; font-size: 0.85rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #d0d8d0; border-radius: 8px; margin-top: 4px; background: white; }
    input:focus { outline: none; border-color: #2d7a2d; }
    .btn { width: 100%; padding: 14px; background: #2d7a2d; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 600; margin-top: 28px; cursor: pointer; }
    .btn:active { background: #256025; }
    .btn-secondary { background: white; color: #2d7a2d; border: 2px solid #2d7a2d; margin-top: 12px; }
    .hidden { display: none; }
    .spinner { margin: 40px auto; border: 4px solid #d0d8d0; border-top: 4px solid #2d7a2d; border-radius: 50%; width: 44px; height: 44px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result { text-align: center; }
    .batch-id-box { font-size: 1.8rem; font-weight: 700; color: #2d5a2d; margin: 8px 0 20px; letter-spacing: 2px; }
    #qr-img { width: 200px; height: 200px; border: 4px solid white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    #grower-setup { text-align: center; padding: 40px 0; }
    #grower-setup h2 { color: #2d5a2d; margin-bottom: 8px; }
    #grower-setup p { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
  </style>
</head>
<body>

  <a href="index.html" style="display:inline-block;margin-bottom:16px;font-size:0.9rem;color:#2d7a2d;font-weight:600;text-decoration:none">← Hem</a>

  <div id="grower-setup" class="hidden">
    <h2>Vem är du?</h2>
    <p>Ange ditt namn en gång. Det sparas på den här enheten.</p>
    <label>Ditt namn</label>
    <input type="text" id="grower-input" placeholder="t.ex. Erik">
    <button class="btn" onclick="saveGrowerName()">Spara och fortsätt</button>
  </div>

  <div id="main-form" class="hidden">
    <h1>Ny batch</h1>
    <p class="grower-tag">
      Odlare: <span id="grower-display"></span>
      &nbsp;·&nbsp; <a onclick="changeGrowerName()" href="#">ändra</a>
      &nbsp;·&nbsp; <a id="stats-link" href="#" target="_blank">Mina skördar</a>
    </p>

    <div id="form-section">
      <label>Svampsort *</label>
      <input type="text" id="pilzsorte" placeholder="t.ex. Ostronsvamp, Shiitake">

      <label>Substrat (kg) *</label>
      <input type="number" id="substrat_kg" placeholder="t.ex. 2" step="0.1" inputmode="decimal">

      <label>Antal bags *</label>
      <input type="number" id="antal_bags" placeholder="t.ex. 4" inputmode="numeric">

      <label>Inkubation startad *</label>
      <input type="date" id="inkubation_start">

      <label>Kund</label>
      <input type="text" id="kunde" placeholder="t.ex. Erik">

      <button class="btn" onclick="submitBatch()">Skapa batch</button>
    </div>

    <div id="loading" class="hidden"><div class="spinner"></div></div>

    <div id="result" class="hidden">
      <p style="font-size:0.9rem;color:#555;margin-bottom:4px">Batch skapad!</p>
      <p class="batch-id-box" id="batch-id-display"></p>
      <img id="qr-img" alt="QR-kod">
      <br>
      <button class="btn" id="print-btn" onclick="printLabel()" style="margin-top:16px;width:auto;padding:12px 24px">Skriv ut etikett</button>
      <button class="btn btn-secondary" onclick="resetForm()">Skapa ytterligare batch</button>
      <button class="btn btn-secondary" onclick="location.href='index.html'" style="margin-top:8px">Till startsidan</button>
    </div>
  </div>

  <script src="dexie.min.js"></script>
  <script src="db.js"></script>
  <script>
    const BASE_URL = window.location.href.split('?')[0].replace(/new-batch\.html$/, '').replace(/index\.html$/, '');

    // Init
    const storedName = localStorage.getItem('odlare');
    if (!storedName) {
      document.getElementById('grower-setup').classList.remove('hidden');
    } else {
      showMainForm(storedName);
    }
    document.getElementById('inkubation_start').value = new Date().toISOString().split('T')[0];

    function showMainForm(name) {
      document.getElementById('grower-setup').classList.add('hidden');
      document.getElementById('main-form').classList.remove('hidden');
      document.getElementById('grower-display').textContent = name;
      document.getElementById('stats-link').href = BASE_URL + 'stats.html?odlare=' + encodeURIComponent(name);
    }

    function saveGrowerName() {
      const name = document.getElementById('grower-input').value.trim();
      if (!name) { alert('Ange ditt namn.'); return; }
      localStorage.setItem('odlare', name);
      showMainForm(name);
    }

    function changeGrowerName() {
      document.getElementById('grower-input').value = localStorage.getItem('odlare') || '';
      document.getElementById('grower-setup').classList.remove('hidden');
      document.getElementById('main-form').classList.add('hidden');
    }

    let currentBatchId = '';

    async function submitBatch() {
      const pilzsorte      = document.getElementById('pilzsorte').value.trim();
      const substrat_kg    = document.getElementById('substrat_kg').value.trim();
      const antal_bags     = document.getElementById('antal_bags').value.trim();
      const inkubation_start = document.getElementById('inkubation_start').value;

      if (!pilzsorte || !substrat_kg || !antal_bags || !inkubation_start) {
        alert('Fyll i svampsort, substrat, antal bags och inkubationsdatum.');
        return;
      }

      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      try {
        const batchId = await db.createBatch({
          pilzsorte, substrat_kg, antal_bags, inkubation_start,
          kunde: document.getElementById('kunde').value.trim(),
          odlare: localStorage.getItem('odlare') || ''
        });
        currentBatchId = batchId;
        showResult(batchId);
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('form-section').classList.remove('hidden');
        alert('Fel: ' + err.message);
      }
    }

    function showResult(batchId) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('batch-id-display').textContent = batchId;

      const harvestUrl = BASE_URL + 'harvest.html?batch=' + encodeURIComponent(batchId);
      document.getElementById('qr-img').src =
        'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(harvestUrl);
    }

    function printLabel() {
      window.open(BASE_URL + 'label.html?batch=' + encodeURIComponent(currentBatchId), '_blank');
    }

    function resetForm() {
      document.getElementById('result').classList.add('hidden');
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('pilzsorte').value = '';
      document.getElementById('substrat_kg').value = '';
      document.getElementById('antal_bags').value = '';
      document.getElementById('kunde').value = '';
    }
  </script>
</body>
</html>
